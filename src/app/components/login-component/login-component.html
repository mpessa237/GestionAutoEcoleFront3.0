<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
  <div class="card shadow-lg" style="width: 400px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
        <h2 class="fw-bold">SGAE Login</h2>
        <p class="text-muted">Accès Administration</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label">Email Professionnel</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" formControlName="email" class="form-control" placeholder="nom@autoecole.cm">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-key"></i></span>
            <input type="password" formControlName="password" class="form-control" placeholder="••••••••">
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger p-2 small">
          <i class="bi bi-exclamation-triangle"></i> {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100 py-2 fw-bold">
          Se connecter
        </button>
      </form>
    </div>
  </div>
</div>
